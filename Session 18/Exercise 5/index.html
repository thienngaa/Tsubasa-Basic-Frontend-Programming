<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sinh viên</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Quản lý sinh viên</h1>

    <div class="form-section">
      <input type="text" id="name" placeholder="Tên sinh viên">
      <input type="number" id="age" placeholder="Tuổi">
      <input type="text" id="class" placeholder="Lớp">
      <button id="add-btn">Thêm sinh viên</button>
    </div>

    <div class="search-section">
      <input type="text" id="search" placeholder="Tìm kiếm theo tên...">
    </div>

    <table id="student-table">
      <thead>
        <tr>
          <th>STT</th>
          <th>Tên</th>
          <th>Tuổi</th>
          <th>Lớp</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
